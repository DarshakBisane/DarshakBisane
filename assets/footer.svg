<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 70" width="100%" height="100%">
  <defs>
    <linearGradient id="footerLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#ec4899" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <filter id="fGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="860" height="70" rx="10" fill="#030712"/>

  <!-- Glowing Center Beam -->
  <line x1="80" y1="20" x2="780" y2="20" stroke="url(#footerLine)" stroke-width="1.8" filter="url(#fGlow)"/>
  <circle cx="430" cy="20" r="4" fill="#00f0ff" filter="url(#fGlow)"/>
  <circle cx="430" cy="20" r="2" fill="#ffffff"/>

  <!-- Footer Tagline -->
  <text x="430" y="46" fill="#94a3b8" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="500" letter-spacing="1.5" text-anchor="middle">
    ✦ <tspan fill="#e2e8f0">BUILDING TODAY.</tspan> <tspan fill="#38bdf8">LEARNING TOMORROW.</tspan> <tspan fill="#c084fc">ENGINEERING THE FUTURE.</tspan> ✦
  </text>
</svg>
