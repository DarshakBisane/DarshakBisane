<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="aiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes floatCore {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes ringSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .floating-core {
        animation: floatCore 4s ease-in-out infinite;
      }
      .ring-1 {
        transform-origin: 200px 150px;
        animation: ringSpin 18s linear infinite;
      }
      .ring-2 {
        transform-origin: 200px 150px;
        animation: ringSpin 24s linear infinite reverse;
      }
    </style>
  </defs>

  <rect width="400" height="300" rx="12" fill="#030712"/>
  <circle cx="200" cy="150" r="130" fill="url(#aiGlow)"/>

  <!-- Orbital Cyber Rings -->
  <g class="ring-1">
    <ellipse cx="200" cy="150" rx="130" ry="50" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="16 10 4 10" filter="url(#coreGlow)"/>
    <circle cx="330" cy="150" r="3.5" fill="#00f0ff" filter="url(#coreGlow)"/>
    <circle cx="70" cy="150" r="2.5" fill="#38bdf8"/>
  </g>
  <g class="ring-2">
    <ellipse cx="200" cy="150" rx="110" ry="75" fill="none" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="10 8" transform="rotate(40 200 150)"/>
    <circle cx="280" cy="90" r="3" fill="#ec4899" filter="url(#coreGlow)"/>
  </g>

  <!-- 3D Isometric AI Hypercube -->
  <g class="floating-core" transform="translate(200, 150)">
    <!-- Base Shadow -->
    <ellipse cx="0" cy="80" rx="60" ry="20" fill="#000000" opacity="0.7"/>

    <!-- Central Isometric Cube -->
    <g>
      <!-- Top Face -->
      <polygon points="0,-55 55,-18 0,18 -55,-18" fill="url(#topFace)" stroke="#00f0ff" stroke-width="1.5" filter="url(#coreGlow)"/>
      <!-- Left Face -->
      <polygon points="-55,-18 0,18 0,80 -55,44" fill="url(#leftFace)" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.7"/>
      <!-- Right Face -->
      <polygon points="0,18 55,-18 55,44 0,80" fill="url(#rightFace)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.8"/>

      <!-- Inner glowing circuits -->
      <line x1="0" y1="-55" x2="0" y2="18" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.9"/>
      <line x1="-55" y1="-18" x2="55" y2="-18" stroke="#ffffff" stroke-width="1" stroke-opacity="0.6"/>
      <line x1="0" y1="18" x2="0" y2="80" stroke="#00f0ff" stroke-width="1.8" filter="url(#coreGlow)"/>

      <!-- Synapse Vertices -->
      <circle cx="0" cy="-55" r="4" fill="#00f0ff" filter="url(#coreGlow)"/>
      <circle cx="55" cy="-18" r="3.5" fill="#a855f7" filter="url(#coreGlow)"/>
      <circle cx="-55" cy="-18" r="3.5" fill="#3b82f6"/>
      <circle cx="0" cy="18" r="5" fill="#ffffff" filter="url(#coreGlow)"/>
      <circle cx="0" cy="80" r="3.5" fill="#00f0ff"/>
      <circle cx="55" cy="44" r="3" fill="#ec4899"/>
      <circle cx="-55" cy="44" r="3" fill="#3b82f6"/>
    </g>

    <!-- Satellite Nodes -->
    <g transform="translate(80, -50)">
      <line x1="-25" y1="32" x2="0" y2="0" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.8" stroke-dasharray="3 3"/>
      <polygon points="0,-14 14,-6 0,2 -14,-6" fill="#00f0ff" opacity="0.9"/>
      <circle cx="0" cy="-6" r="2.5" fill="#ffffff" filter="url(#coreGlow)"/>
    </g>
    <g transform="translate(-85, 40)">
      <line x1="30" y1="-22" x2="0" y2="0" stroke="#a855f7" stroke-width="1" stroke-opacity="0.8" stroke-dasharray="3 3"/>
      <polygon points="0,-12 12,-5 0,2 -12,-5" fill="#a855f7" opacity="0.9"/>
      <circle cx="0" cy="-5" r="2" fill="#ffffff"/>
    </g>
  </g>
</svg>
