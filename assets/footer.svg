<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 60" width="100%" height="100%">
  <defs>
    <linearGradient id="footerLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="subtleGlowFooter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="860" height="60" rx="8" fill="#030712"/>

  <!-- Sleek Cyber Line -->
  <line x1="120" y1="18" x2="740" y2="18" stroke="url(#footerLineGrad)" stroke-width="1.5" filter="url(#subtleGlowFooter)"/>
  <circle cx="430" cy="18" r="3" fill="#00f0ff" filter="url(#subtleGlowFooter)"/>
  <circle cx="430" cy="18" r="1.5" fill="#ffffff"/>

  <!-- Minimalist Quote -->
  <text x="430" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="12" font-weight="500" letter-spacing="2" text-anchor="middle">
    ✦ <tspan fill="#f1f5f9">BUILDING TODAY.</tspan> <tspan fill="#38bdf8">LEARNING TOMORROW.</tspan> <tspan fill="#c084fc">ENGINEERING THE FUTURE.</tspan> ✦
  </text>
</svg>
