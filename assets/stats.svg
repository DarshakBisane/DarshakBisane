<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 170" width="100%" height="100%">
  <defs>
    <linearGradient id="statsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="barPy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="barML" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="barApi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="barDb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <filter id="glowStat" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .code-stat { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
      .sans-stat { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; }
    </style>
  </defs>

  <!-- Left Card: Telemetry & Activity -->
  <g transform="translate(0, 0)">
    <rect width="415" height="170" rx="10" fill="url(#statsBg)" stroke="#1e293b" stroke-width="1.2"/>
    <text x="24" y="32" fill="#00f0ff" class="code-stat" font-size="12" font-weight="bold" letter-spacing="1">
      ⚡ GITHUB_TELEMETRY // DarshakBisane
    </text>
    <line x1="24" y1="42" x2="390" y2="42" stroke="#1e293b" stroke-width="1"/>

    <!-- Metric 1 -->
    <text x="24" y="70" fill="#94a3b8" class="sans-stat" font-size="12">Core Domain</text>
    <text x="390" y="70" fill="#f8fafc" class="code-stat" font-size="12" font-weight="bold" text-anchor="end">AI/ML &amp; Systems Engineering</text>

    <!-- Metric 2 -->
    <text x="24" y="98" fill="#94a3b8" class="sans-stat" font-size="12">Development Pulse</text>
    <text x="390" y="98" fill="#34d399" class="code-stat" font-size="12" font-weight="bold" text-anchor="end">● Active &amp; Continuous</text>

    <!-- Metric 3 -->
    <text x="24" y="126" fill="#94a3b8" class="sans-stat" font-size="12">Architecture Level</text>
    <text x="390" y="126" fill="#a855f7" class="code-stat" font-size="12" font-weight="bold" text-anchor="end">RAG • Agents • FastAPI</text>

    <!-- Metric 4 -->
    <text x="24" y="152" fill="#94a3b8" class="sans-stat" font-size="12">System State</text>
    <text x="390" y="152" fill="#00f0ff" class="code-stat" font-size="12" font-weight="bold" text-anchor="end">READY FOR COLLABORATION</text>
  </g>

  <!-- Right Card: Core Competency Matrix -->
  <g transform="translate(445, 0)">
    <rect width="415" height="170" rx="10" fill="url(#statsBg)" stroke="#1e293b" stroke-width="1.2"/>
    <text x="24" y="32" fill="#a855f7" class="code-stat" font-size="12" font-weight="bold" letter-spacing="1">
      📊 DOMAIN_DISTRIBUTION_MATRIX
    </text>
    <line x1="24" y1="42" x2="390" y2="42" stroke="#1e293b" stroke-width="1"/>

    <!-- Skill 1: Python & ML -->
    <text x="24" y="66" fill="#cbd5e1" class="code-stat" font-size="11">Python / ML / PyTorch</text>
    <text x="390" y="66" fill="#00f0ff" class="code-stat" font-size="11" text-anchor="end">94%</text>
    <rect x="24" y="73" width="366" height="5" rx="2.5" fill="#1e293b"/>
    <rect x="24" y="73" width="344" height="5" rx="2.5" fill="url(#barPy)" filter="url(#glowStat)"/>

    <!-- Skill 2: FastAPI & Backend -->
    <text x="24" y="98" fill="#cbd5e1" class="code-stat" font-size="11">FastAPI / REST / Async Systems</text>
    <text x="390" y="98" fill="#a855f7" class="code-stat" font-size="11" text-anchor="end">88%</text>
    <rect x="24" y="105" width="366" height="5" rx="2.5" fill="#1e293b"/>
    <rect x="24" y="105" width="322" height="5" rx="2.5" fill="url(#barML)"/>

    <!-- Skill 3: GenAI / RAG / Agents -->
    <text x="24" y="130" fill="#cbd5e1" class="code-stat" font-size="11">RAG / LangChain / Vector DBs</text>
    <text x="390" y="130" fill="#34d399" class="code-stat" font-size="11" text-anchor="end">82%</text>
    <rect x="24" y="137" width="366" height="5" rx="2.5" fill="#1e293b"/>
    <rect x="24" y="137" width="300" height="5" rx="2.5" fill="url(#barDb)"/>
  </g>
</svg>
