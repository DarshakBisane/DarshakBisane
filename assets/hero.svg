<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="75%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="cyanCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="cyberLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="isoTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="isoLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="isoRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
      <circle cx="0" cy="0" r="1" fill="#00f0ff" fill-opacity="0.3"/>
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.75; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.04); }
      }
      @keyframes orbitSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes floatCube {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes blinkDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      @keyframes scanBeam {
        0% { transform: translateY(-100px); opacity: 0; }
        50% { opacity: 0.6; }
        100% { transform: translateY(300px); opacity: 0; }
      }
      .pulsing-core {
        transform-origin: 720px 160px;
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .floating-element {
        animation: floatCube 5s ease-in-out infinite;
      }
      .blink {
        animation: blinkDot 2s ease-in-out infinite;
      }
      .orbit-ring {
        transform-origin: 720px 160px;
        animation: orbitSpin 20s linear infinite;
      }
      .orbit-ring-rev {
        transform-origin: 720px 160px;
        animation: orbitSpin 25s linear infinite reverse;
      }
      .code-font {
        font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
      }
      .title-font {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Outfit', 'Inter', Roboto, sans-serif;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="900" height="320" rx="16" fill="#030712"/>
  <rect width="900" height="320" rx="16" fill="url(#bgGlow)"/>
  <rect width="900" height="320" rx="16" fill="url(#cyberGrid)" opacity="0.7"/>

  <!-- Perspective Grid lines at base -->
  <g opacity="0.3" stroke="#00f0ff" stroke-width="0.5">
    <line x1="0" y1="320" x2="300" y2="240"/>
    <line x1="150" y1="320" x2="380" y2="240"/>
    <line x1="300" y1="320" x2="460" y2="240"/>
    <line x1="450" y1="320" x2="540" y2="240"/>
    <line x1="600" y1="320" x2="620" y2="240"/>
    <line x1="750" y1="320" x2="700" y2="240"/>
    <line x1="900" y1="320" x2="780" y2="240"/>
    <line x1="100" y1="280" x2="800" y2="280" stroke-opacity="0.5"/>
    <line x1="200" y1="255" x2="720" y2="255" stroke-opacity="0.3"/>
  </g>

  <!-- Ambient Light Spreads -->
  <circle cx="720" cy="160" r="140" fill="url(#cyanCoreGlow)" opacity="0.4"/>
  <circle cx="720" cy="160" r="100" fill="url(#violetCoreGlow)" opacity="0.5"/>

  <!-- Left Side Header & HUD Interface -->
  <!-- Top Status Pill -->
  <g transform="translate(45, 40)">
    <rect width="365" height="26" rx="13" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
    <circle cx="16" cy="13" r="4" fill="#00f0ff" class="blink" filter="url(#subtleGlow)"/>
    <text x="28" y="17" fill="#94a3b8" class="code-font" font-size="11" font-weight="600" letter-spacing="1">
      SYS: <tspan fill="#00f0ff">ONLINE</tspan> // NEURAL_SYNC: <tspan fill="#a855f7">ACTIVE</tspan> [v2.6]
    </text>
  </g>

  <!-- Main Identity Name -->
  <g transform="translate(45, 112)">
    <text class="title-font" font-size="44" font-weight="900" letter-spacing="1.5" fill="url(#textGrad)" filter="url(#subtleGlow)">
      DARSHAK BISANE
    </text>
  </g>

  <!-- Accent Divider Line -->
  <path d="M 45 130 L 480 130" stroke="url(#cyberLine)" stroke-width="2"/>
  <polygon points="480,128 486,130 480,132" fill="#ec4899"/>
  <circle cx="45" cy="130" r="3" fill="#00f0ff"/>

  <!-- Role & Focus -->
  <g transform="translate(45, 160)">
    <!-- Terminal prompt symbol -->
    <text x="0" y="0" fill="#00f0ff" class="code-font" font-size="16" font-weight="bold">&gt;&gt;</text>
    <text x="26" y="-1" fill="#f8fafc" class="title-font" font-size="16.5" font-weight="700" letter-spacing="0.5">
      B.Tech Computer Engineering Student
    </text>
    <text x="0" y="24" fill="#a855f7" class="code-font" font-size="16" font-weight="bold">&gt;&gt;</text>
    <text x="26" y="23" fill="#cbd5e1" class="title-font" font-size="15" font-weight="500">
      Aspiring Machine Learning &amp; AI Systems Engineer
    </text>
  </g>

  <!-- Futuristic Badges / Chips Row -->
  <g transform="translate(45, 230)">
    <!-- Chip 1: AI / Agents -->
    <g transform="translate(0, 0)">
      <rect width="105" height="28" rx="6" fill="#0f172a" stroke="#00f0ff" stroke-opacity="0.4" stroke-width="1"/>
      <text x="52" y="18" fill="#38bdf8" class="code-font" font-size="10.5" font-weight="600" text-anchor="middle">
        ⚡ AI AGENTS
      </text>
    </g>
    <!-- Chip 2: RAG & NLP -->
    <g transform="translate(115, 0)">
      <rect width="115" height="28" rx="6" fill="#0f172a" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1"/>
      <text x="57" y="18" fill="#c084fc" class="code-font" font-size="10.5" font-weight="600" text-anchor="middle">
        🧠 RAG &amp; NLP
      </text>
    </g>
    <!-- Chip 3: FastAPI & Backend -->
    <g transform="translate(240, 0)">
      <rect width="130" height="28" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1"/>
      <text x="65" y="18" fill="#60a5fa" class="code-font" font-size="10.5" font-weight="600" text-anchor="middle">
        🚀 FASTAPI &amp; API
      </text>
    </g>
    <!-- Chip 4: MLOps -->
    <g transform="translate(380, 0)">
      <rect width="95" height="28" rx="6" fill="#0f172a" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
      <text x="47" y="18" fill="#34d399" class="code-font" font-size="10.5" font-weight="600" text-anchor="middle">
        ⚙️ MLOPS
      </text>
    </g>
  </g>

  <!-- Bottom Coordinates & HUD telemetry -->
  <g transform="translate(45, 290)">
    <text fill="#475569" class="code-font" font-size="9.5" letter-spacing="1">
      LAT: 19.0760° N // LON: 72.8777° E // ARCH: x86_64 // AGENT_ORCHESTRATOR: ACTIVE
    </text>
  </g>

  <!-- RIGHT SIDE: 3D ISOMETRIC AI NEURAL CORE & ORBITAL MATRIX -->
  <g class="pulsing-core">
    <!-- Orbital Rings -->
    <g class="orbit-ring">
      <ellipse cx="720" cy="160" rx="105" ry="42" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="12 8 4 8" filter="url(#subtleGlow)"/>
      <circle cx="825" cy="160" r="3" fill="#00f0ff" filter="url(#neonGlow)"/>
      <circle cx="615" cy="160" r="2.5" fill="#38bdf8"/>
    </g>
    <g class="orbit-ring-rev">
      <ellipse cx="720" cy="160" rx="90" ry="70" fill="none" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="8 6" filter="url(#subtleGlow)" transform="rotate(35 720 160)"/>
      <circle cx="780" cy="110" r="3" fill="#ec4899" filter="url(#neonGlow)"/>
      <circle cx="660" cy="210" r="2.5" fill="#a855f7"/>
    </g>
    <g>
      <ellipse cx="720" cy="160" rx="125" ry="125" fill="none" stroke="#3b82f6" stroke-width="0.7" stroke-opacity="0.25" stroke-dasharray="4 14"/>
    </g>

    <!-- Floating 3D Isometric Quantum AI Core -->
    <g class="floating-element" transform="translate(720, 160)">
      <!-- Base Shadow -->
      <ellipse cx="0" cy="65" rx="55" ry="18" fill="#000000" opacity="0.6"/>

      <!-- Isometric Central Cube Layer 1 (Center) -->
      <g>
        <!-- Top Face -->
        <polygon points="0,-40 46,-14 0,12 -46,-14" fill="url(#isoTop)" stroke="#00f0ff" stroke-width="1.5" filter="url(#subtleGlow)"/>
        <!-- Left Face -->
        <polygon points="-46,-14 0,12 0,65 -46,39" fill="url(#isoLeft)" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.6"/>
        <!-- Right Face -->
        <polygon points="0,12 46,-14 46,39 0,65" fill="url(#isoRight)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.7"/>

        <!-- Inner glowing circuits on faces -->
        <line x1="0" y1="-40" x2="0" y2="12" stroke="#ffffff" stroke-width="1" stroke-opacity="0.8"/>
        <line x1="-46" y1="-14" x2="46" y2="-14" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.5"/>
        <line x1="0" y1="12" x2="0" y2="65" stroke="#00f0ff" stroke-width="1.5" filter="url(#subtleGlow)"/>

        <!-- Neural Synapse Nodes on vertices -->
        <circle cx="0" cy="-40" r="3.5" fill="#00f0ff" filter="url(#neonGlow)"/>
        <circle cx="46" cy="-14" r="3" fill="#a855f7" filter="url(#neonGlow)"/>
        <circle cx="-46" cy="-14" r="3" fill="#3b82f6"/>
        <circle cx="0" cy="12" r="4.5" fill="#ffffff" filter="url(#neonGlow)"/>
        <circle cx="0" cy="65" r="3" fill="#00f0ff"/>
        <circle cx="46" cy="39" r="2.5" fill="#ec4899"/>
        <circle cx="-46" cy="39" r="2.5" fill="#3b82f6"/>
      </g>

      <!-- Satellite Micro-Nodes (Neural Network) -->
      <!-- Top Right Node -->
      <g transform="translate(68, -45)">
        <line x1="-22" y1="31" x2="0" y2="0" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.7" stroke-dasharray="3 3"/>
        <polygon points="0,-12 12,-5 0,2 -12,-5" fill="#00f0ff" opacity="0.8"/>
        <circle cx="0" cy="-5" r="2" fill="#ffffff" filter="url(#neonGlow)"/>
      </g>
      <!-- Bottom Left Node -->
      <g transform="translate(-70, 35)">
        <line x1="24" y1="-23" x2="0" y2="0" stroke="#a855f7" stroke-width="0.8" stroke-opacity="0.7" stroke-dasharray="3 3"/>
        <polygon points="0,-10 10,-4 0,2 -10,-4" fill="#a855f7" opacity="0.8"/>
        <circle cx="0" cy="-4" r="2" fill="#ffffff"/>
      </g>
      <!-- Top Left Node -->
      <g transform="translate(-62, -50)">
        <line x1="16" y1="36" x2="0" y2="0" stroke="#3b82f6" stroke-width="0.8" stroke-opacity="0.5" stroke-dasharray="2 2"/>
        <circle cx="0" cy="0" r="3" fill="#38bdf8" filter="url(#subtleGlow)"/>
      </g>
      <!-- Bottom Right Node -->
      <g transform="translate(65, 52)">
        <line x1="-19" y1="-13" x2="0" y2="0" stroke="#ec4899" stroke-width="0.8" stroke-opacity="0.5" stroke-dasharray="2 2"/>
        <circle cx="0" cy="0" r="3" fill="#ec4899" filter="url(#subtleGlow)"/>
      </g>
    </g>
  </g>

  <!-- HUD Corner Brackets & Tech Details -->
  <!-- Top Left Bracket -->
  <path d="M 18 35 L 18 18 L 35 18" stroke="#00f0ff" stroke-width="1.8" fill="none" opacity="0.8"/>
  <!-- Top Right Bracket -->
  <path d="M 882 35 L 882 18 L 865 18" stroke="#00f0ff" stroke-width="1.8" fill="none" opacity="0.8"/>
  <!-- Bottom Left Bracket -->
  <path d="M 18 285 L 18 302 L 35 302" stroke="#a855f7" stroke-width="1.8" fill="none" opacity="0.8"/>
  <!-- Bottom Right Bracket -->
  <path d="M 882 285 L 882 302 L 865 302" stroke="#a855f7" stroke-width="1.8" fill="none" opacity="0.8"/>

  <!-- Subtle Target Crosshair Top Right -->
  <g transform="translate(850, 45)" opacity="0.4">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#00f0ff" stroke-width="0.75"/>
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#00f0ff" stroke-width="0.75"/>
    <line x1="0" y1="-16" x2="0" y2="16" stroke="#00f0ff" stroke-width="0.75"/>
    <circle cx="0" cy="0" r="2" fill="#00f0ff"/>
  </g>
</svg>
